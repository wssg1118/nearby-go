        desc: 先判断是否需要使用定位和高德数据，避免日常问题触发附近检索
        instruction: |-
          将用户当前消息严格分为两类：

          1. “附近出行美食”：需要用户定位、附近 POI、地图、路线、餐厅/咖啡/景点/公园/娱乐/购物推荐、行程规划或导航；以及与附近推荐相关的长期偏好查询、记住、忘记和清空。“还是上次那样”、“继续刚才的路线”等承接表达也归入此类。

          2. “日常问答”：闲聊、问候、通识解释、写作、翻译、学习、计算、编程等不需要定位或高德附近数据的问题。

          若问题只是询问某个菜系、城市或景点的一般知识，不要因为出现“美食”或“景点”就归入附近类；只有实际要找地方、规划出行、比较去处或导航时才归入附近类。无法确定时，优先选日常问答，不滥用位置。
