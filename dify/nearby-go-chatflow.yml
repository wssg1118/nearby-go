    - data:
        code: |-
          import json

          def main(body, status_code=None, request_context='{}'):
              def load_object(value):
                  if isinstance(value, dict):
                      return value
                  try:
                      parsed = json.loads(str(value or '{}'))
                      return parsed if isinstance(parsed, dict) else {}
                  except (TypeError, ValueError, json.JSONDecodeError):
                      return {}

              def compact_place(place):
                  dropped = ('longitude', 'latitude', 'score', 'poi_id', 'image_urls')
                  return {key: value for key, value in place.items() if key not in dropped}

              def compact_segment(segment):
                  if not isinstance(segment, dict):
                      return {}
                  return {key: value for key, value in segment.items() if key != 'route_polyline'}

              def compact_day(day):
                  if not isinstance(day, dict):
                      return {}
                  compacted = {key: value for key, value in day.items()}
                  stops = compacted.get('stops')
                  if isinstance(stops, list):
                      compacted['stops'] = [
                          {**stop, 'segment': compact_segment(stop.get('segment'))}
                          if isinstance(stop, dict) else stop
                          for stop in stops
                      ]
                  return compacted

              try:
                  status = int(status_code) if status_code not in (None, '') else 200
              except (TypeError, ValueError):
                  status = 0

              context = load_object(request_context)
              payload = load_object(body)
              notes = []
              if not (200 <= status < 300) or not payload:
                  result = {
                      'response_state': 'service_error',
                      'quality_notes': ['附近数据服务暂时不可用或返回了无法解析的数据。'],
                      'data': {'places': [], 'additional_places': [], 'itinerary_days': [], 'warnings': []},
                  }
                  return {
                      'validated_result': json.dumps(result, ensure_ascii=False),
                      'response_state': 'service_error',
                      'quality_notes': json.dumps(result['quality_notes'], ensure_ascii=False),
                  }

              places = payload.get('places') if isinstance(payload.get('places'), list) else []
              additional = payload.get('additional_places') if isinstance(payload.get('additional_places'), list) else []
              itinerary = payload.get('itinerary') if isinstance(payload.get('itinerary'), list) else []
              itinerary_days = payload.get('itinerary_days') if isinstance(payload.get('itinerary_days'), list) else []
              warnings = payload.get('warnings') if isinstance(payload.get('warnings'), list) else []
              if not places:
                  state = 'empty'
                  notes.append('当前范围和筛选条件下没有可用候选。')
              else:
                  state = 'ready'

              avoid_terms = context.get('avoid_terms') if isinstance(context.get('avoid_terms'), list) else []
              conflicts = []
              for place in places:
                  if not isinstance(place, dict):
                      continue
                  searchable = ' '.join(
                      str(place.get(key) or '') for key in ('name', 'category', 'address', 'tags')
                  ).lower()
                  matched = [term for term in avoid_terms if str(term).lower() in searchable]
                  if matched:
                      conflicts.append({
                          'place_name': str(place.get('name') or '未命名地点'),
                          'matched_terms': matched,
                      })
              if conflicts:
                  state = 'needs_caution'
                  notes.append('候选文本与用户避雷项存在字面匹配，不能把这些候选当作已确认满足约束。')
              if warnings and state == 'ready':
                  state = 'partial'
              if not itinerary_days and context.get('response_mode') in ('itinerary', 'multi_day'):
                  notes.append('用户请求了行程，但接口没有生成可用的分日计划。')
              if context.get('location_source') == 'fallback':
                  notes.append('未取得有效浏览器坐标，本次使用默认位置进行检索。')
              if context.get('decision_priority') not in (None, '', 'balanced'):
                  notes.append('后端使用距离、评分、预算、偏好与来源顺序的综合排序；用户决策偏好只用于解释，不能声称已改变后端权重。')

              unverified = []
              dietary = context.get('dietary_needs') if isinstance(context.get('dietary_needs'), list) else []
              accessibility = context.get('accessibility_needs') if isinstance(context.get('accessibility_needs'), list) else []
              if dietary:
                  unverified.append({'type': '饮食要求', 'values': [str(item) for item in dietary]})
              if accessibility:
                  unverified.append({'type': '可达性要求', 'values': [str(item) for item in accessibility]})

              compact_data = {
                  'transport': payload.get('transport'),
                  'places': [compact_place(p) for p in places if isinstance(p, dict)],
                  'additional_places': [compact_place(p) for p in additional if isinstance(p, dict)],
                  'itinerary': [compact_segment(s) for s in itinerary],
                  'itinerary_days': [compact_day(d) for d in itinerary_days if isinstance(d, dict)],
                  'planning_assumptions': payload.get('planning_assumptions')
                      if isinstance(payload.get('planning_assumptions'), list) else [],
                  'warnings': warnings,
              }

              result = {
                  'response_state': state,
                  'quality_notes': notes,
                  'constraint_conflicts': conflicts,
                  'unverified_constraints': unverified,
                  'request_context': context,
                  'data': compact_data,
              }
              return {
                  'validated_result': json.dumps(result, ensure_ascii=False),
                  'response_state': state,
                  'quality_notes': json.dumps(notes, ensure_ascii=False),
              }
