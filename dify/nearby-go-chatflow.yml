    - data:
        code: |-
          import json
          import re

          def main(explain_text, visual_cards, place_photos):
              text = str(explain_text or '').strip()
              cards = str(visual_cards or '').strip()
              try:
                  photos = json.loads(place_photos) if isinstance(place_photos, str) else (place_photos or [])
              except (TypeError, ValueError, json.JSONDecodeError):
                  photos = []
              if not isinstance(photos, list) or not text:
                  return {'final_answer': '\n\n'.join(x for x in (text, cards) if x)}

              lines = text.split('\n')
              consumed = set()
              unmatched = []
              for photo in photos:
                  if not isinstance(photo, dict):
                      continue
                  image_url = str(photo.get('image_url') or '')
                  if not image_url.startswith('https://'):
                      continue
                  name = re.sub(r'[\[\]()`<>\r\n]+', ' ', str(photo.get('name') or '附近地点')).strip()[:30]
                  photo_line = f"![{photo.get('index', '')}·{name}]({image_url})"
                  nav_url = str(photo.get('navigation_url') or '')
                  target = None
                  if nav_url.startswith('https://'):
                      for position, line in enumerate(lines):
                          if position in consumed or nav_url not in line:
                              continue
                          target = position
                          break
                  if target is not None:
                      consumed.add(target)
                      lines[target] = lines[target].rstrip() + '\n\n' + photo_line
                  else:
                      unmatched.append(photo_line)
              if unmatched:
                  lines.extend(['', '### 推荐地点图片'] + unmatched)
              return {'final_answer': '\n'.join(lines) + ('\n\n' + cards if cards else '')}
