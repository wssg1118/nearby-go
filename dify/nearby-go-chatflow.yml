    - data:
        code: |-
          import json
          import re

          EMPTY_PROFILE = {
              'version': 1,
              'preferences': [],
              'avoid_terms': [],
              'dietary_needs': [],
              'accessibility_needs': [],
              'companion_profile': [],
              'notes': [],
          }

          def main(current_profile, memory_action=None, remember_preferences=None,
                   remember_avoid_terms=None, remember_dietary_needs=None,
                   remember_accessibility_needs=None,
                   remember_companion_profile=None, remember_notes=None,
                   forget_memory_terms=None):
              def clean_list(value, limit=12):
                  if isinstance(value, str):
                      value = [item.strip() for item in value.replace('，', ',').split(',')]
                  if not isinstance(value, list):
                      return []
                  cleaned = []
                  for item in value:
                      text = re.sub(r'[\x00-\x1f\x7f]+', ' ', str(item)).strip()[:40]
                      if not text:
                          continue
                      # 长期画像不保存疑似手机号、精确坐标、密钥或口令。
                      if re.search(r'(?<!\d)1[3-9]\d{9}(?!\d)', text):
                          continue
                      if re.search(r'-?\d{2,3}\.\d{3,}\s*[,，]\s*-?\d{1,2}\.\d{3,}', text):
                          continue
                      if re.search(r'(?:api[_ -]?key|token|密码|口令|密钥)', text, re.I):
                          continue
                      if text not in cleaned:
                          cleaned.append(text)
                  return cleaned[:limit]

              def empty_profile():
                  return {key: list(value) if isinstance(value, list) else value
                          for key, value in EMPTY_PROFILE.items()}

              try:
                  parsed = json.loads(current_profile) if isinstance(current_profile, str) else current_profile
              except (TypeError, ValueError, json.JSONDecodeError):
                  parsed = {}
              profile = empty_profile()
              if isinstance(parsed, dict):
                  for key in profile:
                      if key != 'version':
                          profile[key] = clean_list(parsed.get(key))

              action = str(memory_action or 'none').strip().lower()
              forget_terms = clean_list(forget_memory_terms, 20)
              updates = {
                  'preferences': clean_list(remember_preferences),
                  'avoid_terms': clean_list(remember_avoid_terms),
                  'dietary_needs': clean_list(remember_dietary_needs),
                  'accessibility_needs': clean_list(remember_accessibility_needs),
                  'companion_profile': clean_list(remember_companion_profile),
                  'notes': clean_list(remember_notes),
              }
              before = json.dumps(profile, ensure_ascii=False, sort_keys=True)
              notice = ''

              if action == 'clear':
                  profile = empty_profile()
                  notice = '已按你的要求清空长期偏好。'
              else:
                  if action in ('forget', 'update') and forget_terms:
                      lowered_terms = [item.lower() for item in forget_terms]
                      for key in updates:
                          profile[key] = [
                              item for item in profile[key]
                              if not any(term in item.lower() for term in lowered_terms)
                          ]
                  has_updates = any(updates.values())
                  if action == 'update':
                      for key, values in updates.items():
                          profile[key] = clean_list(profile[key] + values)
                  applied_updates = action == 'update' and has_updates
                  if forget_terms and applied_updates:
                      notice = '已按你的要求更新长期偏好，并忘记指定内容。'
                  elif forget_terms:
                      notice = '已按你的要求忘记指定的长期偏好。'
                  elif applied_updates:
                      notice = '已按你的明确授权更新长期偏好。'

              after = json.dumps(profile, ensure_ascii=False, sort_keys=True)
              if before == after and action != 'clear':
                  notice = ''
              return {
                  'updated_profile': json.dumps(profile, ensure_ascii=False, separators=(',', ':')),
                  'memory_notice': notice,
                  'memory_changed': 'true' if before != after else 'false',
              }
