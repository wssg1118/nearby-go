    - data:
        code: |-
          import json

          PLACE_FIELDS = (
              'poi_id', 'name', 'category', 'address', 'group', 'route_from',
              'route_status', 'straight_distance_meters', 'route_distance_meters',
              'route_duration_minutes', 'rating', 'cost_per_person', 'tags',
              'navigation_url',
          )
          RESPONSE_FIELDS = (
              'transport', 'radius_meters', 'duration_minutes', 'duration_days',
              'total_planned_minutes', 'total_travel_minutes',
              'total_visit_minutes', 'total_flexible_minutes', 'itinerary',
              'itinerary_days', 'planning_assumptions', 'warnings',
          )

          def main(body, status_code=None, request_context='{}'):
              def load_object(value):
                  if isinstance(value, dict):
                      return value
                  try:
                      parsed = json.loads(str(value or '{}'))
                      return parsed if isinstance(parsed, dict) else {}
                  except (TypeError, ValueError, json.JSONDecodeError):
                      return {}

              try:
                  status = int(status_code) if status_code not in (None, '') else 200
              except (TypeError, ValueError):
                  status = 0

              context = load_object(request_context)
              payload = load_object(body)
              if not (200 <= status < 300) or not payload:
                  result = {
                      'response_state': 'service_error',
                      'quality_notes': ['附近数据服务暂时不可用或返回了无法解析的数据。'],
                      'request_context': context,
                      'data': {'places': [], 'itinerary_days': [], 'warnings': []},
                  }
                  return {
                      'validated_result': json.dumps(result, ensure_ascii=False),
                      'response_state': 'service_error',
                  }

              raw_places = payload.get('places') if isinstance(payload.get('places'), list) else []
              places = [
                  {key: place.get(key) for key in PLACE_FIELDS if key in place}
                  for place in raw_places if isinstance(place, dict)
              ]
              safe_payload = {
                  key: payload.get(key) for key in RESPONSE_FIELDS if key in payload
              }
              safe_payload['places'] = places
              notes = []
              state = 'ready' if places else 'empty'
              if not places:
                  notes.append('当前范围和筛选条件下没有可用候选。')

              warnings = safe_payload.get('warnings')
              if isinstance(warnings, list) and warnings and state == 'ready':
                  state = 'partial'

              avoid_terms = context.get('avoid_terms') if isinstance(context.get('avoid_terms'), list) else []
              conflicts = []
              for place in places:
                  searchable = ' '.join(
                      str(place.get(key) or '') for key in ('name', 'category', 'address', 'tags')
                  ).lower()
                  matched = [term for term in avoid_terms if str(term).lower() in searchable]
                  if matched:
                      conflicts.append({
                          'place_name': str(place.get('name') or '未命名地点'),
                          'matched_terms': matched,
                      })
              if conflicts:
                  state = 'needs_caution'
                  notes.append('候选文本与本次避开项存在字面匹配，不能当作已满足约束。')

              if context.get('response_mode') in ('itinerary', 'multi_day'):
                  days = safe_payload.get('itinerary_days')
                  if not isinstance(days, list) or not days:
                      if state == 'ready':
                          state = 'partial'
                      notes.append('用户请求了行程，但接口没有生成可用的分日计划。')
              if context.get('location_source') == 'fallback':
                  notes.append('未取得有效浏览器坐标，本次使用默认位置进行检索。')

              unverified = []
              for key, label in (
                  ('dietary_needs', '饮食要求'),
                  ('accessibility_needs', '可达性要求'),
              ):
                  values = context.get(key)
                  if isinstance(values, list) and values:
                      unverified.append({'type': label, 'values': values})
              if unverified:
                  notes.append('饮食和可达性要求未由高德 POI 数据确认，需要向商家或场所核实。')

              result = {
                  'response_state': state,
                  'quality_notes': notes,
                  'constraint_conflicts': conflicts,
                  'unverified_constraints': unverified,
                  'request_context': context,
                  'data': safe_payload,
              }
              return {
                  'validated_result': json.dumps(result, ensure_ascii=False),
                  'response_state': state,
              }
        code_language: python3
        desc: 校验 HTTP、空结果、路线警告与本次约束，并移除说明节点不需要的坐标和内部排序分
