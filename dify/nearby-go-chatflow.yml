    - data:
        code: |-
          import json
          import re
          from urllib.parse import urljoin, urlparse

          def main(body, backend_base_url):
              def safe_text(value, limit=40):
                  return re.sub(r'[\[\]()`<>\r\n]+', ' ', str(value or '')).strip()[:limit]

              try:
                  payload = json.loads(body) if isinstance(body, str) else body
              except (TypeError, ValueError, json.JSONDecodeError):
                  payload = {}
              if not isinstance(payload, dict):
                  return {'visual_cards': '', 'place_photos': '[]'}

              blocks = []
              base_url = str(backend_base_url or '').rstrip('/') + '/'
              route_path = str(payload.get('route_map_path') or '')
              map_url = ''
              if route_path.startswith('/api/route-map?') and base_url.startswith('https://'):
                  map_url = urljoin(base_url, route_path.lstrip('/'))
                  blocks.extend([
                      '## 高德位置概览',
                      f'![map:附近候选与实际路线示意]({map_url})',
                      '> 地图已按高德实际路线绘制；未取得路线的路段以直线示意，导航请以高德 App 实时路线为准。',
                  ])

              places = payload.get('places') if isinstance(payload.get('places'), list) else []
              itinerary = payload.get('itinerary') if isinstance(payload.get('itinerary'), list) else []

              def place_distance(place, segment):
                  if isinstance(segment, dict):
                      distance = segment.get('route_distance_meters')
                      minutes = segment.get('route_duration_minutes') or segment.get('planning_duration_minutes')
                      if isinstance(distance, (int, float)) and isinstance(minutes, (int, float)):
                          return f'{round(distance)}m · {round(minutes)}分钟'
                      if isinstance(distance, (int, float)):
                          return f'{round(distance)}m'
                  straight = place.get('straight_distance_meters') if isinstance(place, dict) else None
                  if isinstance(straight, (int, float)):
                      return f'直线{round(straight)}m'
                  return '待确认'

              table_rows = []
              for index, place in enumerate(places, start=1):
                  if not isinstance(place, dict):
                      continue
                  name = safe_text(place.get('name'), 24) or '附近地点'
                  url = str(place.get('navigation_url') or '')
                  name_cell = f'[{name}]({url})' if url.startswith('https://uri.amap.com/') else name
                  rating = place.get('rating')
                  rating_cell = f'{round(rating, 1)}' if isinstance(rating, (int, float)) else '-'
                  cost = place.get('cost_per_person')
                  cost_cell = f'{round(cost)}元' if isinstance(cost, (int, float)) else '-'
                  segment = itinerary[index - 1] if index - 1 < len(itinerary) else None
                  table_rows.append(f'| {index} | {name_cell} | {rating_cell} | {cost_cell} | {place_distance(place, segment)} |')
              if table_rows:
                  blocks.extend([
                      '### 对比一览',
                      '| 排名 | 推荐 | 评分 | 人均 | 距离·时间 |',
                      '| --- | --- | --- | --- | --- |',
                  ] + table_rows)

              additional = payload.get('additional_places') if isinstance(payload.get('additional_places'), list) else []
              one_liners = []
              for place in additional:
                  if not isinstance(place, dict):
                      continue
                  name = safe_text(place.get('name'), 30) or '附近地点'
                  category = str(place.get('category') or '').split(';')[-1].strip()
                  details = [category] if category else []
                  distance = place.get('straight_distance_meters')
                  if isinstance(distance, (int, float)):
                      details.append(f'直线约 {round(distance)} 米')
                  rating = place.get('rating')
                  if isinstance(rating, (int, float)):
                      details.append(f'评分 {rating}')
                  cost = place.get('cost_per_person')
                  if isinstance(cost, (int, float)):
                      details.append(f'人均 {round(cost)} 元')
                  url = str(place.get('navigation_url') or '')
                  line = f'- **{name}**（' + '、'.join(details) + '）'
                  if url.startswith('https://uri.amap.com/'):
                      line += f' — [高德导航]({url})'
                  one_liners.append(line)
              if one_liners:
                  blocks.extend(['### 其他候选'] + one_liners)

              def slim_place(place, index):
                  urls = place.get('image_urls') if isinstance(place.get('image_urls'), list) else []
                  image_url = ''
                  if urls:
                      try:
                          parsed = urlparse(str(urls[0]))
                      except ValueError:
                          parsed = None
                      if parsed is not None and parsed.scheme == 'https' and parsed.netloc:
                          image_url = parsed.geturl()
                  return {
                      'index': index,
                      'name': safe_text(place.get('name'), 30) or '附近地点',
                      'category': safe_text(str(place.get('category') or '').split(';')[-1], 20),
                      'address': safe_text(place.get('address'), 60),
                      'tags': [safe_text(tag, 12) for tag in (place.get('tags') or [])][:4],
                      'rating': place.get('rating') if isinstance(place.get('rating'), (int, float)) else None,
                      'cost_per_person': place.get('cost_per_person') if isinstance(place.get('cost_per_person'), (int, float)) else None,
                      'straight_distance_meters': place.get('straight_distance_meters') if isinstance(place.get('straight_distance_meters'), (int, float)) else None,
                      'navigation_url': place.get('navigation_url') if str(place.get('navigation_url') or '').startswith('https://') else '',
                      'image_url': image_url,
                  }

              data_blob = {
                  'transport': payload.get('transport'),
                  'route_map_url': map_url,
                  'places': [slim_place(place, index) for index, place in enumerate(places, start=1) if isinstance(place, dict)],
                  'additional_places': [slim_place(place, index) for index, place in enumerate(additional, start=1) if isinstance(place, dict)],
              }
              blocks.append(f'<!--NEARBYGO-DATA:{json.dumps(data_blob, ensure_ascii=False, separators=(",", ":"))}-->')

              place_photos = []
              for entry in data_blob['places']:
                  if entry.get('image_url'):
                      place_photos.append({
                          'index': entry['index'],
                          'name': entry['name'],
                          'image_url': entry['image_url'],
                          'navigation_url': entry['navigation_url'],
                      })
              return {
                  'visual_cards': '\n\n'.join(blocks),
                  'place_photos': json.dumps(place_photos, ensure_ascii=False),
              }
        code_language: python3
