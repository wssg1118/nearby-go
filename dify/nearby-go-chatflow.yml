      你好，我是 **NearbyGo 附近灵感向导** 🧭

      告诉我你想吃什么、玩什么，或直接说可用时间、预算、同行人和氛围偏好。我会基于你本次定位与可核实的高德地点/路线数据，给出主选、备选或可执行行程。

      我会结合最近对话理解“还是上次那样”；只有你明确说“记住……”时才保存长期偏好，也可以随时说“忘记……”或“清空长期偏好”。

      定位只用于本次附近检索；营业时间、门票、排队与现场活动仍建议出发前核实。
