<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; media-src 'self' blob:; img-src 'self' data: https://*.autonavi.com https://*.amap.com; style-src 'self'; script-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'" />
    <title>附近发现 · NearbyGo</title>
    <link rel="stylesheet" href="/styles.css?v=20260830-2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">NEARBY LIFE GUIDE</p>
          <h1>附近发现 · NearbyGo</h1>
        </div>
        <div class="topbar-actions">
          <button id="readAloudButton" class="clear-chat-button" type="button" aria-pressed="true">🔊 自动朗读</button>
          <button id="clearChatButton" class="clear-chat-button" type="button">清空对话</button>
          <button id="locationButton" class="location-button" type="button">
            <span class="pulse"></span>
            <span id="locationLabel">正在定位</span>
          </button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
          <div class="avatar">游</div>
          <div class="bubble">
            <p>告诉我你想吃什么、预算和可用时间，我会结合当前位置与实际路线推荐。</p>
            <p class="hint">例如：两个人，人均 80，想吃辣的，步行 20 分钟内。</p>
          </div>
        </article>
      </section>

      <section class="quick-prompts" aria-label="快捷提问">
        <button type="button" data-prompt="推荐附近人均50元以内、步行20分钟内的晚餐">便宜晚餐</button>
        <button type="button" data-prompt="附近有什么适合聊天学习的咖啡店？">咖啡学习</button>
        <button type="button" data-prompt="帮我安排一个吃饭加游玩的三小时路线">吃饭＋游玩</button>
        <button type="button" data-prompt="帮我安排一个两天一夜的附近吃喝游玩攻略，每天约8小时">周末两日</button>
      </section>

      <form id="composer" class="composer">
        <button id="voiceButton" class="voice-button" type="button" aria-label="按下语音输入">🎙️</button>
        <textarea
          id="queryInput"
          rows="1"
          maxlength="2000"
          placeholder="可以问日常问题，也可说附近想吃什么、去哪玩……"
          aria-label="输入推荐需求"
        ></textarea>
        <button id="sendButton" type="submit" aria-label="发送">发送</button>
      </form>
      <p class="privacy-note">聊天记录仅保存在此设备浏览器，可随时清空；定位不保存。路线、价格和营业信息可能变化，请以商家及高德地图为准。</p>
    </main>
    <script src="/markdown.js?v=20260831-1" defer></script>
    <script src="/app.js?v=20260831-2" defer></script>
  </body>
</html>
